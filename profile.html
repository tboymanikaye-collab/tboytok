<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TboyTok Profile</title>

    <style>
        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .profile {
            padding: 40px 20px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #222;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .username {
            color: #aaa;
        }

        .bio {
            margin: 25px 0;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 45px;
            margin: 30px 0;
        }

        .stats b {
            font-size: 20px;
        }

        .stats span {
            display: block;
            color: #aaa;
            font-size: 13px;
            margin-top: 5px;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="profile">

        <div class="avatar">
            👤
        </div>

        <h1>Tboy</h1>

        <div class="username">
            @tboy
        </div>

        <p class="bio">
            🔥 Welcome to my TboyTok profile
        </p>

        <div class="stats">

            <div>
                <b>0</b>
                <span>Following</span>
            </div>

            <div>
                <b>0</b>
                <span>Followers</span>
            </div>

            <div>
                <b>0</b>
                <span>Likes</span>
            </div>

        </div>

        <button onclick="location.href='index.html'">
            ← Back
        </button>

    </div>

</body>
</html>
