<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TboyTok</title>

    <style>
        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }

        .header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }

        .video {
            height: 70vh;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .bottom {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 65px;
            background: #111;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .bottom div {
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="header">
        TboyTok
    </div>

    <div class="video">
        🎥 Your Video
    </div>

    <div class="bottom">
        <div>🏠<br>Home</div>
        <div>🔍<br>Search</div>
        <div>➕<br>Upload</div>
        <div>👤<br>Profile</div>
    </div>

</body>
</html>
