<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TboyTok</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .feed {
            width: 100%;
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }

        .video-box {
            width: 100%;
            height: 100vh;
            position: relative;
            scroll-snap-align: start;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info {
            position: absolute;
            left: 15px;
            bottom: 90px;
            text-shadow: 0 1px 5px #000;
        }

        .info h3 {
            margin: 0 0 8px;
        }

        .info p {
            margin: 0;
        }

        .actions {
            position: absolute;
            right: 15px;
            bottom: 120px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: center;
        }

        .actions div {
            font-size: 28px;
        }

        .actions span {
            display: block;
            font-size: 12px;
        }

        .nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: #050505;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav div {
            text-align: center;
            font-size: 12px;
            cursor: pointer;
        }

        .nav b {
            display: block;
            font-size: 22px;
            margin-bottom: 3px;
        }
    </style>
</head>

<body>

    <div class="feed">

        <!-- VIDEO 1 -->
        <div class="video-box">

            <video
                src="videos/test.mp4"
                autoplay
                muted
                loop
                playsinline>
            </video>

            <div class="info">
                <h3>@tboy</h3>
                <p>Welcome to TboyTok 🔥</p>
            </div>

            <div class="actions">
                <div>❤️<span>0</span></div>
                <div>💬<span>0</span></div>
                <div>↗️<span>Share</span></div>
            </div>

        </div>


        <!-- VIDEO 2 -->
        <div class="video-box">

            <video
                src="videos/test.mp4"
                muted
                loop
                playsinline>
            </video>

            <div class="info">
                <h3>@creator</h3>
                <p>Another video on TboyTok 🎥</p>
            </div>

            <div class="actions">
                <div>❤️<span>0</span></div>
                <div>💬<span>0</span></div>
                <div>↗️<span>Share</span></div>
            </div>

        </div>

    </div>


    <!-- BOTTOM NAVIGATION -->
    <div class="nav">

        <div onclick="location.href='index.html'">
            <b>🏠</b>
            Home
        </div>

        <div>
            <b>🔍</b>
            Search
        </div>

        <div>
            <b>➕</b>
            Upload
        </div>

        <div onclick="location.href='profile.html'">
            <b>👤</b>
            Profile
        </div>

    </div>


    <!-- TAP VIDEO TO MUTE / UNMUTE -->
    <script>

        document.querySelectorAll("video").forEach(video => {

            video.addEventListener("click", () => {

                video.muted = !video.muted;

            });

        });

    </script>

</body>
</html>
