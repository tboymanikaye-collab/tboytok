<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TboyTok</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.app {
    height: 100vh;
    width: 100%;
    position: relative;
}

.feed {
    height: 100vh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
}

.video {
    height: 100vh;
    width: 100%;
    position: relative;
    scroll-snap-align: start;
    background: #151515;
    display: flex;
    align-items: center;
    justify-content: center;
}

.video video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.info {
    position: absolute;
    bottom: 85px;
    left: 15px;
    right: 80px;
    text-shadow: 0 1px 4px #000;
}

.username {
    font-weight: bold;
    font-size: 18px;
    margin-bottom: 8px;
}

.caption {
    font-size: 15px;
}

.actions {
    position: absolute;
    right: 12px;
    bottom: 100px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    text-align: center;
}

.action {
    font-size: 28px;
}

.action span {
    display: block;
    font-size: 12px;
    margin-top: 3px;
}

.nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 65px;
    background: rgba(0,0,0,0.9);
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 10;
}

.nav div {
    text-align: center;
    font-size: 12px;
}

.nav b {
    display: block;
    font-size: 23px;
    margin-bottom: 2px;
}
</style>
</head>

<body>

<div class="app">

    <div class="feed">

        <section class="video">
          <video src="videos/test.mp4" autoplay muted loop playsinline></video>
            <div class="info">
                <div class="username">@tboy</div>
                <div class="caption">Welcome to TboyTok 🔥</div>
            </div>

            <div class="actions">
                <div class="action">❤️<span>0</span></div>
                <div class="action">💬<span>0</span></div>
                <div class="action">↗️<span>Share</span></div>
            </div>
        </>

        <section class="video">
            <div class="info">
                <div class="username">@creator</div>
                <div class="caption">Another video on TboyTok 🎥</div>
            </div>

            <div class="actions">
                <div class="action">❤️<span>0</span></div>
                <div class="action">💬<span>0</span></div>
                <div class="action">↗️<span>Share</span></div>
            </div>
        </section>

    </div>

    <div class="nav">
        <div><b>🏠</b>Home</div>
        <div><b>🔍</b>Search</div>
        <div><b>➕</b>Upload</div>
        <div><b>👤</b>Profile</div>
    </div>

</div>

</body>
</html>
